<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="{{description}}" />
    <link rel="canonical" href="https://izabelaswitaj.pl/portfolio/{{slug}}/" />
    <meta property="og:type" content="article" />
    <meta property="og:locale" content="pl_PL" />
    <meta property="og:title" content="{{title}} — Izabela Świtaj" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:url" content="https://izabelaswitaj.pl/portfolio/{{slug}}/" />
    <meta property="og:image" content="https://izabelaswitaj.pl/{{imagePath}}" />
    <meta property="og:image:alt" content="{{imageAlt}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>{{title}} — Izabela Świtaj</title>
    <link rel="icon" href="../../assets/logo.jpeg" type="image/jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../portfolio.css?v=20261104-6" />
    <link rel="stylesheet" href="../project-heading.css?v=20261106-1" />
  </head>
  <body class="case-page">
    <a class="skip-link" href="#projekt-{{slug}}">Przejdź do projektu</a>
    <header class="portfolio-header">
      <a class="brand" href="../"><strong>Izabela Świtaj</strong><span>portfolio</span></a>
      <nav aria-label="Nawigacja projektu"><a href="../">Wszystkie projekty</a><a href="#kontakt">Kontakt</a></nav>
    </header>
    <main>
      <div class="case-cover">
        <img src="../../{{imagePath}}" alt="{{imageAlt}}" width="{{imageWidth}}" height="{{imageHeight}}" fetchpriority="high" decoding="async" />
      </div>
      <section class="projects case-content" aria-label="Prezentacja projektu">
        <article id="projekt-{{slug}}" class="project" aria-labelledby="project-{{slug}}-title">
          <header class="project-heading">
            <p class="project-number">{{number}} / {{label}}</p>
            <div class="project-intro">
              <h1 id="project-{{slug}}-title">{{title}}</h1>
              <p class="project-style">Styl: {{style}}</p>
              <p class="project-software">Oprogramowanie: {{software}}</p>
              <ul class="project-tags" aria-label="Zakres projektu">{{tagsHtml}}</ul>
              <nav class="project-index" aria-label="Spis treści projektu">{{navigationHtml}}</nav>
            </div>
          </header>
          <div class="project-story">
            <!-- Przygotuj indywidualną narrację i media wewnątrz poniższych sekcji. -->
            {{sectionsHtml}}
          </div>
        </article>
      </section>
      <nav class="project-pagination" aria-label="Pozostałe projekty"><a href="../">← Wróć do portfolio</a></nav>
      <section id="kontakt" class="contact" aria-labelledby="contact-title">
        <div><p class="eyebrow">Kontakt</p><h2 id="contact-title">Izabela Świtaj</h2></div>
        <address><a href="mailto:izabela.switaj@gmail.com">izabela.switaj@gmail.com</a><a href="tel:+48502272469">502 272 469</a><span>Warszawa</span></address>
      </section>
    </main>
  </body>
</html>
